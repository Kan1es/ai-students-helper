x-service: &service
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://assistant:assistant@db:5432/assistant
  restart: unless-stopped
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d assistant"]
      interval: 3s
      timeout: 3s
      retries: 20
  init:
    <<: *service
    restart: "no"
    command: ["python", "-m", "app.init_db"]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *service
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *service
    command: ["python", "-m", "app.worker"]
    depends_on:
      init: {condition: service_completed_successfully}
volumes:
  postgres_data:
